<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>{{title}}</title>
<style>
 body{font-family:Arial;max-width:700px;margin:30px auto}
 textarea{width:100%;height:180px;padding:10px} button{padding:10px 20px;margin-top:10px}
 #out{background:#f1f3f5;color:#222;padding:15px;border-radius:8px;margin-top:15px;white-space:pre-wrap}
</style></head>
<body>
<h2>{{title}}</h2>
<textarea id="text" placeholder="{{hint}}"></textarea><br>
<button onclick="run()">Go ✨</button>
<div id="out">Result yahan aayega...</div>
<script>
async function run(){
  const out = document.getElementById("out"); out.innerText = "Soch raha hoon...";
  const res = await fetch("/run", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text:document.getElementById("text").value})});
  out.innerText = (await res.json()).result;
}
</script></body></html>
